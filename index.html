<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heera Store | Luxury Boutique</title>
    <style>
        :root {
            --accent: #D4AF37;
            --bg: #050505;
            --surface: #111111;
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --font-serif: 'Playfair Display', 'Times New Roman', serif;
            --font-sans: 'Inter', 'Segoe UI', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
        }

        .snap-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        section {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            scroll-snap-align: start;
            position: relative;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(40px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .animate {
            opacity: 0;
            animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }

        h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        p {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            max-width: 500px;
            text-transform: uppercase;
        }

        /* Styling for the subtitle and date */
        .subtitle-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Aligning content to the right */
            width: 100%;
            max-width: 450px;
        }

        .date-text {
            font-size: 0.65rem;
            margin-top: 5px;
            color: var(--accent);
            letter-spacing: 3px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-top: 2rem;
        }

        .gallery-item {
            aspect-ratio: 3/4;
            background: var(--surface);
            border: 1px solid #222;
            transition: 0.5s ease;
        }

        .gallery-item:hover { border-color: var(--accent); }

        .form-container { width: 100%; max-width: 350px; margin-top: 2rem; }

        .input-group {
            position: relative;
            margin-bottom: 30px;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: white;
            outline: none;
        }

        .input-group label {
            position: absolute;
            top: 10px;
            left: 0;
            color: var(--text-dim);
            transition: 0.3s;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -15px;
            font-size: 0.6rem;
            color: var(--accent);
        }

        .btn-inquire {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px 50px;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.4s;
        }

        .btn-inquire:hover { background: var(--accent); color: black; }

        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: 1fr; height: 50vh; overflow-y: auto; }
            h1 { font-size: 2.2rem; }
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--accent);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

<div class="snap-container">
    
    <section>
        <h1 class="animate">HEERA</h1>
        <div class="subtitle-container animate delay-1">
            <p>The House Of Readymade</p>
            <span class="date-text">-Since 1989.</span>
        </div>
        <div class="scroll-indicator animate delay-2">SCROLL</div>
    </section>

    <section>
        <h1 style="font-size: 1.8rem;">Our Legacy</h1>
        <p>A curated collection of timeless pieces, designed for those who settle for nothing less than perfection.</p>
    </section>

    <section>
        <h1>Curated</h1>
        <div class="gallery-grid">
            <div class="gallery-item"></div>
            <div class="gallery-item"></div>
            <div class="gallery-item"></div>
            <div class="gallery-item"></div>
        </div>
    </section>

    <section>
        <h1>Inquire</h1>
        <div class="form-container">
            <div class="input-group">
                <input type="text" required>
                <label>Name</label>
            </div>
            <div class="input-group">
                <input type="email" required>
                <label>Email</label>
            </div>
            <button class="btn-inquire">Send Request</button>
        </div>
    </section>

</div>

</body>
</html>
